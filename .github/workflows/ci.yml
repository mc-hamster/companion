name: Validate userscript

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install pnpm
        run: npm install --global pnpm@11.25.0
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build userscript
        run: pnpm build
      - name: Check syntax
        run: pnpm check
      - name: Run tests
        run: pnpm test
      - name: Verify committed release files match the source
        run: |
          git diff --exit-code -- dist/
          test -z "$(git ls-files --others --exclude-standard -- dist/)"
