<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Companion QA — live progress</title>
<style>body{font:14px/1.5 system-ui;margin:0;background:#f5f7fb;color:#17213a}main{max-width:1250px;margin:auto;padding:24px}h1{font-size:24px;margin:0}.muted{color:#617087;font-size:12px}.top{display:flex;align-items:start;justify-content:space-between;gap:20px}.badge{display:inline-block;border-radius:5px;padding:3px 7px;font-size:11px;font-weight:650;white-space:nowrap}.passed{background:#d5f2e4;color:#185d3a}.failed{background:#ffe1e1;color:#8f2525}.running{background:#dceaff;color:#234c92}.blocked,.not-run{background:#fff0c9;color:#765514}.not-applicable{color:#697489;background:#edf0f5}.counts{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0}.metric{background:white;border:1px solid #d5ddea;border-radius:8px;padding:12px;min-width:95px}.metric strong{font-size:24px;display:block}.controls{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}button,input,select{font:inherit;border:1px solid #b8c5d8;border-radius:5px;padding:6px 9px;background:white;color:inherit}button{cursor:pointer}button[aria-pressed=true]{background:#245de4;color:white}input{min-width:200px;flex:1}section.area{margin:20px 0}h2{font-size:17px;margin:12px 0}details.case{background:white;border:1px solid #d5ddea;border-radius:6px;margin:6px 0;padding:10px}summary{cursor:pointer;display:flex;gap:10px;align-items:center;flex-wrap:wrap}summary .title{flex:1;min-width:160px}.case p{margin:8px 0}.case label{font-weight:650;display:inline-block;min-width:100px}.focus{background:#e6edff;border-left:4px solid #3265cf;padding:12px;margin:12px 0}.environment{padding:8px 0;border-top:1px solid #d5ddea}pre{white-space:pre-wrap;overflow-wrap:anywhere}#automation article{background:white;padding:8px;border-bottom:1px solid #d5ddea}.failure{border-left:4px solid #bc3838}small{font-size:11px}a{color:#245de4}#connection{font-weight:650}.activity{max-height:180px;overflow:auto;background:white;padding:10px;border:1px solid #d5ddea}ul{padding-left:20px}@media(max-width:650px){main{padding:14px}.top{display:block}h1{font-size:21px}.metric{padding:8px;min-width:75px}summary{gap:5px}.lane{font-size:10px}}</style></head>
<body><main><div class="top"><div><h1>Companion QA</h1><div id="artifact" class="muted"></div></div><div><span id="connection">Connecting…</span><div id="updated" class="muted"></div></div></div>
<div class="focus"><strong id="phase">Audit in progress</strong><div id="focus"></div></div><div id="counts" class="counts"></div><p id="run-label" class="muted"></p>
<div class="controls"><button data-view="matrix" aria-pressed="true">Acceptance matrix</button><button data-view="failures">Failures</button><button data-view="automation">Automated results</button><input id="search" type="search" placeholder="Find a case, feature or result…" aria-label="Search test matrix"><select id="status" aria-label="Filter status"><option value="all">All statuses</option><option value="passed">Passed</option><option value="failed">Failed</option><option value="pending">Pending</option></select></div>
<p class="muted">Automation and browser lanes are independent. A scenario passes only when every applicable lane passes. Untested extension environments stay visible below.</p>
<div id="matrix"></div><div id="automation" hidden></div><h2>Defects found during this audit</h2><div id="findings"></div><h2>Recent activity</h2><div id="activity" class="activity"></div><h2>Environment coverage</h2><div id="environments"></div></main>
<script>
let data,view='matrix';const $=id=>document.getElementById(id), el=(tag,text,cls)=>{const node=document.createElement(tag);if(text!=null)node.textContent=text;if(cls)node.className=cls;return node;};
const lanes=item=>[item.automation,item.browser].filter(lane=>lane.status!=='not applicable');
const overall=item=>lanes(item).some(lane=>lane.status==='failed')?'failed':lanes(item).every(lane=>lane.status==='passed')?'passed':'pending';
function badge(text,status){return el('span',text,'badge '+status.replaceAll(' ','-'));}
function render(){if(!data)return;const opened=new Set([...document.querySelectorAll('details.case[open]')].map(node=>node.id));
$('artifact').textContent='Artifact '+data.artifact.version+' · '+data.artifact.sha256.slice(0,12);$('phase').textContent=data.phase;$('focus').textContent=data.focus;$('updated').textContent='Updated '+new Date(data.updatedAt).toLocaleTimeString();
$('run-label').textContent='Latest run: '+data.automation.label+' · '+(data.automation.latestCount||data.automation.tests.length)+' checks in this run. Counts aggregate results for this exact artifact.';
$('counts').replaceChildren(...[['Scenarios',data.cases.length],['Passed',data.cases.filter(c=>overall(c)==='passed').length],['Failed',data.cases.filter(c=>overall(c)==='failed').length],['Pending',data.cases.filter(c=>overall(c)==='pending').length],['Auto tests',data.automation.tests.length],['Auto failures',data.automation.tests.filter(t=>t.status==='failed').length]].map(([label,value])=>{const box=el('div',null,'metric');box.append(el('strong',value),el('span',label));return box;}));
const query=$('search').value.toLowerCase(),status=$('status').value;
const cases=data.cases.filter(c=>(!query||JSON.stringify(c).toLowerCase().includes(query))&&(status==='all'||overall(c)===status)&&(view!=='failures'||overall(c)==='failed'));
$('matrix').hidden=view==='automation';$('automation').hidden=view!=='automation';$('matrix').replaceChildren();
for(const area of [...new Set(cases.map(c=>c.area))]){const section=el('section',null,'area');section.append(el('h2',area));
for(const item of cases.filter(c=>c.area===area)){const box=el('details',null,'case '+(overall(item)==='failed'?'failure':''));box.id=item.id;box.open=opened.has(item.id)||overall(item)==='failed'||item.automation.status==='running'||item.browser.status==='running';
const summary=el('summary');summary.append(el('strong',item.id),el('span',item.context,'title'),badge(overall(item),overall(item)),badge('Auto: '+item.automation.status,item.automation.status),badge('Browser: '+item.browser.status,item.browser.status));box.append(summary);
for(const [label,value] of [['Priority',item.priority],['Preconditions',item.context],['Steps',item.steps],['Expected',item.expected]]){const p=el('p');p.append(el('label',label),document.createTextNode(value));box.append(p);}
for(const note of [...item.notes,...item.automation.evidence,...item.browser.evidence])box.append(el('p',note,'muted'));section.append(box);} $('matrix').append(section);}
$('automation').replaceChildren();for(const test of data.automation.tests.filter(t=>(!query||JSON.stringify(t).toLowerCase().includes(query))&&(status==='all'||t.status===status))){const article=el('article');article.append(badge(test.status,test.status),document.createTextNode(' '+test.name));if(test.details)article.append(el('pre',test.details));$('automation').append(article);}
$('activity').replaceChildren(...data.activity.slice(0,25).map(item=>el('div',new Date(item.time).toLocaleTimeString()+' · '+item.text)));
$('findings').replaceChildren(...(data.findings||[]).map(item=>{const row=el('details',null,'case');const summary=el('summary');summary.append(el('strong',item.id+' · '+item.case),badge(item.status,item.status==='fixed'?'passed':'failed'),el('span',item.summary,'title'));row.append(summary);for(const note of [item.evidence,item.resolution].filter(Boolean))row.append(el('p',note,'muted'));return row;}));
$('environments').replaceChildren(...data.environments.map(item=>el('div',item.name+' — '+item.status,'environment')));}
for(const button of document.querySelectorAll('[data-view]'))button.onclick=()=>{view=button.dataset.view;for(const b of document.querySelectorAll('[data-view]'))b.setAttribute('aria-pressed',String(b===button));render();};$('search').oninput=render;$('status').onchange=render;
async function refresh(){try{const response=await fetch('/qa-progress.json',{cache:'no-store'});data=await response.json();$('connection').textContent='Live';render();}catch{$('connection').textContent='Disconnected — last results retained';}}
let events;function connect(){if(document.hidden){events?.close();events=null;return;}refresh();if(!events){events=new EventSource('/qa-progress-events');events.onmessage=refresh;events.onerror=()=>{$('connection').textContent='Reconnecting…';};}}document.addEventListener('visibilitychange',connect);connect();
</script></body></html>
